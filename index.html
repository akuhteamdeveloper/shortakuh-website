
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="ShortAkuH — aplikasi desktop untuk membantu membuat video Shorts dengan workflow sederhana dan pemrosesan lokal.">
    <meta name="theme-color" content="#0b0b0b">

    <title>ShortAkuH — Video Creator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #0b0b0b;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .page {
            width: 100%;
            max-width: 900px;
            padding: 40px 24px;
            text-align: center;
        }

        .brand {
            color: #ff8c00;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 28px;
        }

        h1 {
            font-size: clamp(48px, 8vw, 86px);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 20px;
        }

        h2 {
            color: #ff8c00;
            font-size: clamp(24px, 4vw, 38px);
            font-weight: 700;
            margin-bottom: 18px;
        }

        .tagline {
            color: #b8b8b8;
            font-size: clamp(17px, 2vw, 21px);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .download-button,
        .secondary-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            padding: 16px 28px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            text-decoration: none;
            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .download-button {
            background: #ff8c00;
            color: #000000;
            border: 1px solid #ff8c00;
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.18);
        }

        .download-button:hover {
            background: #ffa500;
            border-color: #ffa500;
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(255, 140, 0, 0.35);
        }

        .secondary-button {
            background: #151515;
            color: #ff8c00;
            border: 1px solid #ff8c00;
        }

        .secondary-button:hover {
            background: #252525;
            transform: translateY(-2px);
            box-shadow: 0 0 24px rgba(255, 140, 0, 0.12);
        }

        .download-note {
            color: #777777;
            font-size: 12px;
            margin-top: 14px;
            line-height: 1.6;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 55px;
            flex-wrap: wrap;
        }

        .feature {
            flex: 1 1 160px;
            max-width: 240px;
            min-width: 0;
            padding: 18px 22px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 10px;
        }

        .feature strong {
            display: block;
            color: #ff8c00;
            font-size: 15px;
            margin-bottom: 6px;
        }

        .feature span {
            color: #999999;
            font-size: 13px;
            line-height: 1.5;
        }

        .footer {
            margin-top: 55px;
            color: #555555;
            font-size: 12px;
            line-height: 1.8;
        }

        .footer a {
            color: #777777;
            text-decoration: none;
        }

        .footer a:hover {
            color: #ff8c00;
        }

        @media (max-width: 600px) {
            .page {
                padding: 36px 18px;
            }

            .brand {
                margin-bottom: 24px;
            }

            h1 {
                font-size: clamp(42px, 12vw, 64px);
            }

            .button-group {
                flex-direction: column;
                width: 100%;
            }

            .download-button,
            .secondary-button {
                width: 100%;
                max-width: 340px;
            }

            .features {
                gap: 10px;
                margin-top: 40px;
            }

            .feature {
                flex: 1 1 100%;
                max-width: 340px;
                padding: 16px;
            }

            .footer {
                margin-top: 40px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="page">

        <div class="brand">SHORTAKUH</div>

        <h1>ShortAkuH</h1>

        <h2>Video Creator</h2>

        <p class="tagline">
            Create Shorts Faster.
        </p>

        <div class="button-group">

            <a
                class="download-button"
                href="https://github.com/akuhteamdeveloper/ShortAkuH-Releases/releases/latest/download/ShortAkuh_Window_0.6.4.2.zip"
                aria-label="Download ShortAkuH untuk Windows"
            >
                Download ShortAkuH
            </a>

            <a
                class="secondary-button"
                href="https://avora.id/akuhteamdeveloper"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Cek produk lain di Avora"
            >
                Cek Produk Lain
            </a>

        </div>

        <p class="download-note">
            Windows desktop application · Free download
        </p>

        <section class="features" aria-label="Fitur ShortAkuH">

            <div class="feature">
                <strong>⚡ Fast</strong>
                <span>Create Shorts Faster</span>
            </div>

            <div class="feature">
                <strong>🎬 Simple</strong>
                <span>Easy Video Workflow</span>
            </div>

            <div class="feature">
                <strong>🔒 Local</strong>
                <span>Desktop Processing</span>
            </div>

        </section>

        <footer class="footer">
            <p>© 2026 ShortAkuH</p>
            <p>
                <a
                    href="https://shortakuh.com"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Powered by ShortAkuH
                </a>
            </p>
        </footer>

    </main>
</body>
</html>
