
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b0b">
    <title>ShortAkuH — Video Creator</title>

    <style>
        body {
            background: #0b0b0b;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .led-rail {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 30px;
            overflow: hidden;
            pointer-events: none;
        }

        .led-light {
            position: absolute;
            top: 50%;
            left: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow:
                0 0 5px 2px #ffffff,
                0 0 12px 5px #ff8c00,
                0 0 25px 10px #ff8c00;
            transform: translateY(-50%);
            animation: ledMove 3s ease-in-out infinite alternate;
        }

        @keyframes ledMove {
            from { left: 10px; }
            to { left: calc(100% - 20px); }
        }
    </style>
</head>

<body>
    <div class="led-rail" aria-hidden="true">
        <div class="led-light"></div>
    </div>

    <h1>ShortAkuH</h1>
    <h2>Video Creator</h2>
</body>
</html>
