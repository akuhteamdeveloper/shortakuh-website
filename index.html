<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShortAkuH AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #0b0b0b;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .page {
            width: 100%;
            max-width: 900px;
            padding: 40px 24px;
            text-align: center;
        }

        .brand {
            color: #ff8c00;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 28px;
        }

        h1 {
            font-size: clamp(48px, 8vw, 86px);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 20px;
        }

        h2 {
            color: #ff8c00;
            font-size: clamp(24px, 4vw, 38px);
            font-weight: 700;
            margin-bottom: 18px;
        }

        .tagline {
            color: #b8b8b8;
            font-size: clamp(17px, 2vw, 21px);
            margin-bottom: 30px;
        }

        .download-button {
            display: inline-block;
            padding: 16px 34px;
            background: #ff8c00;
            color: #000000;
            text-decoration: none;
            font-size: 17px;
            font-weight: 700;
            border-radius: 10px;
            transition: 0.2s ease;
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.18);
        }

        .download-button:hover {
            background: #ffa500;
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(255, 140, 0, 0.35);
        }

        .coming-soon {
            color: #ff8c00;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 4px;
            margin-top: 24px;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 55px;
            flex-wrap: wrap;
        }

        .feature {
            min-width: 160px;
            padding: 18px 22px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 10px;
        }

        .feature strong {
            display: block;
            color: #ff8c00;
            font-size: 15px;
            margin-bottom: 6px;
        }

        .feature span {
            color: #999999;
            font-size: 13px;
        }

        .footer {
            margin-top: 55px;
            color: #555555;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .page {
                padding: 30px 18px;
            }

            .features {
                gap: 10px;
                margin-top: 40px;
            }

            .feature {
                min-width: 140px;
                padding: 15px;
            }

            .footer {
                margin-top: 40px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="brand">SHORTAKUH AI</div>

        <h1>ShortAkuH AI</h1>

        <h2>AI Video Creator</h2>

        <p class="tagline">
            Create Shorts Faster.
        </p>

        <a
            class="download-button"
            href="https://avora.id/akuhteamdeveloper"
        >
            Download ShortAkuH
        </a>

        <div class="coming-soon">
            COMING SOON
        </div>

        <section class="features">

            <div class="feature">
                <strong>⚡ Fast</strong>
                <span>Create Shorts Faster</span>
            </div>

            <div class="feature">
                <strong>🎬 Simple</strong>
                <span>Easy Video Workflow</span>
            </div>

            <div class="feature">
                <strong>🔒 Local</strong>
                <span>Desktop Processing</span>
            </div>

        </section>

        <div class="footer">
            © 2026 ShortAkuH AI
        </div>

    </main>

</body>
</html>
